[project]
name = "repo-automation"
version = "0.1.0"
description = "Reusable supervised automation for bounded agent work."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "ruff==0.15.18",
    "ty==0.0.51",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "pytest-codspeed==5.0.2",
    "coverage==7.14.0",
    "mkdocs-material==9.7.6",
    "pip-audit==2.7.3",
]

[tool.uv]
# Tooling-and-tests project, not a distributable package; skip build/install.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["automation/tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["automation"]
branch = true
omit = [
    "automation/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
# Match the line length the codebase was written and previously linted against.
line-length = 130
target-version = "py311"

[tool.ruff.lint]
# E402: the supervisor and context entrypoints intentionally insert the repo
# root on sys.path before importing first-party modules. This preserves the
# prior pylint `wrong-import-position` exemption.
ignore = ["E402"]

[tool.ty.environment]
python-version = "3.11"
