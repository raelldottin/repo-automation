name: Commit hygiene

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attribution-trailers:
    name: No agent attribution trailers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commits added by this pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          else
            range="origin/$DEFAULT_BRANCH..HEAD"
          fi
          Tools/check-commit-trailers.sh "$range"
