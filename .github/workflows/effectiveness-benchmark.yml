name: Effectiveness Benchmark

# Measures how effective the harness is at producing working code by having it rebuild
# ProgramBench programs and scoring them with ProgramBench's black-box test suites.
#
# This is heavyweight (Docker cleanroom images + LLM calls + long runtime), so it never
# runs on push/PR. Requires the repository secret NVIDIA_API_KEY (an OpenAI-compatible key
# for the agent).
#
# Nightly execution is intentionally disabled while model availability and viable phase
# budgets are being established. Run manually so every campaign has an explicit model,
# purpose, and generation.
#
# This is an administered experiment, not a health check. The last nightly - run
# 36724292484 - spent 5h34m to produce nothing interpretable: nine cells each hit the
# 1800s wall having written no file, then the provider stopped serving the pinned model
# mid-run. A cron that can consume hours without yielding a readable effectiveness result
# is worse than no cron, because its failures arrive unattributed. Restore the schedule
# only alongside a representative campaign design, not merely once this incident closes.

on:
  workflow_dispatch:
    inputs:
      run_all:
        description: "Run the full ProgramBench instance set"
        type: boolean
        default: true
      instances:
        description: "Space-separated instance ids (used when run_all is false)"
        type: string
        default: ""
      experiment:
        description: "Run the A-E lane experiment instead of a single benchmark run"
        type: boolean
        default: false
      lanes:
        description: "Lanes to run (experiment only)"
        type: string
        default: "A B C D E"
      repeats:
        description: "Attempts per lane/instance (experiment only; >=2 recommended)"
        type: string
        default: "2"
      timeout:
        description: "Per-instance agent budget in seconds (split across a lane's phases by fixed ceilings)"
        type: string
        default: "3300"
      model:
        description: "Model id served by the NVIDIA endpoint"
        type: string
        default: "z-ai/glm-5.3"
      preflight_only:
        description: "Verify the benchmark environment and stop; no agent session, no cell, no model tokens"
        type: boolean
        default: false
      probe:
        description: "Diagnostic only: run one research phase over the stream-json transport instead of any benchmark. Not a lane; its output is not comparable with a cell."
        type: boolean
        default: false
      probe_max_turns:
        description: "Diagnostic only: stop the probe session after N tool-calling iterations (empty = uncapped). 1 reads the first turn's accounting without paying for the whole phase."
        type: string
        default: ""
      probe_budget:
        description: "Diagnostic only: the probe's wall ceiling in seconds. Raise it above the phase ceiling when capping turns, so the cap is what ends the session."
        type: string
        default: "600"

permissions:
  contents: read

concurrency:
  group: effectiveness-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: Rebuild + eval + score
    runs-on: ubuntu-latest # native x86_64: ProgramBench cleanroom images run without emulation.
    timeout-minutes: 360
    env:
      # Hermes drives every lane. The runner is held fixed on purpose: A-E differ only in
      # context and workflow, so a lane that changed execution engine would measure the
      # engine, not the treatment.
      REPO_AUTOMATION_AGENT_RUNNER: hermes
      HERMES_INFERENCE_PROVIDER: nvidia
      # `inputs` is populated for workflow_dispatch only, and an empty `model` input is
      # falsy, so this guard supplies the baseline id for both - and for any trigger added
      # later. It was added when a nightly schedule existed; that schedule is gone, but a
      # run whose model id resolved to the empty string is still the failure to avoid.
      HERMES_INFERENCE_MODEL: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.model
            || 'z-ai/glm-5.3' }}
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # Job-level so every run.json records which Hermes produced the result.
      HERMES_REVISION: b6a87db515e493faba25e4a09d9e15dac6ddab37
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Require NVIDIA_API_KEY
        run: |
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo "::error::Repository secret NVIDIA_API_KEY is not set; the agent cannot run." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (harness + ProgramBench)
        run: |
          uv sync
          uv pip install programbench

      # Hermes refuses to build a wheel and is distributed as a checkout, so pin it the
      # way the J-Space artifact is pinned: one named revision, installed from the tree it
      # names. Bump HERMES_REVISION deliberately; an unpinned agent silently changes the
      # execution engine between runs that are supposed to be comparable.
      - name: Install agent CLI (hermes)
        run: |
          # Fetch the one pinned revision, not the history: a full clone of this repo is
          # ~1GB, a single-revision fetch is ~80MB.
          git init --quiet "$RUNNER_TEMP/hermes-agent"
          git -C "$RUNNER_TEMP/hermes-agent" remote add origin https://github.com/NousResearch/hermes-agent
          git -C "$RUNNER_TEMP/hermes-agent" fetch --quiet --depth 1 origin "$HERMES_REVISION"
          git -C "$RUNNER_TEMP/hermes-agent" checkout --quiet FETCH_HEAD
          # The venv lives outside the checkout: Hermes warns that a venv inside the tree
          # the agent operates on can be wiped by the agent mid-session.
          uv venv "$RUNNER_TEMP/hermes-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/hermes-venv/bin/python" -e "$RUNNER_TEMP/hermes-agent"
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"

      # Hermes silently ignores config keys it does not know, so a key that was renamed
      # or removed upstream would leave a control at its default while run.json claimed the
      # benchmark posture. Check every key against the pinned revision's own defaults.
      - name: Verify the benchmark config matches the pinned agent
        run: |
          "$RUNNER_TEMP/hermes-venv/bin/python" - <<'PY'
          import os, sys, yaml
          sys.path.insert(0, os.environ["RUNNER_TEMP"] + "/hermes-agent")
          from hermes_cli.config_defaults import DEFAULT_CONFIG
          from hermes_cli.config import TERMINAL_CONFIG_ENV_MAP

          # A key is honoured if the defaults carry it, or - for `terminal.*` - if the
          # config-to-env bridge mirrors it. `docker_persist_across_processes` is the
          # second kind: absent from DEFAULT_CONFIG, but bridged to
          # TERMINAL_DOCKER_PERSIST_ACROSS_PROCESSES and read from there by terminal_tool.
          # Being in neither is the failure this step exists to catch.
          def unknown(node, defaults, prefix=""):
              for key, value in node.items():
                  path = f"{prefix}{key}"
                  bridged = prefix == "terminal." and key in TERMINAL_CONFIG_ENV_MAP
                  if not isinstance(defaults, dict) or key not in defaults:
                      if not bridged:
                          yield path
                  elif isinstance(value, dict):
                      yield from unknown(value, defaults[key], f"{path}.")

          # Both files: run_agent.sh appends the cleanroom fragment to the benchmark
          # profile, and a silently ignored `docker_network` is an agent with internet.
          profiles = {}
          for name in ("hermes-benchmark.yaml", "hermes-cleanroom.yaml"):
              profiles[name] = yaml.safe_load(open(f"automation/supervisor/{name}"))
              missing = list(unknown(profiles[name], DEFAULT_CONFIG))
              if missing:
                  print(f"::error::{name}: keys absent from Hermes {os.environ['HERMES_REVISION']}: {missing}")
                  sys.exit(1)
              print(f"{name}: every key resolves against {os.environ['HERMES_REVISION']}")

          # The fragment is appended, not merged, so a top-level key in both files would
          # leave YAML's last-one-wins silently discarding the benchmark profile's copy.
          shared = set(profiles["hermes-benchmark.yaml"]) & set(profiles["hermes-cleanroom.yaml"])
          if shared:
              print(f"::error::Both profiles define {sorted(shared)}; appending would drop the benchmark profile's.")
              sys.exit(1)
          PY

      # Preflight with the wrapper the benchmark actually calls, not with a hand-written
      # invocation that resembles it. A probe only proves whatever it chose to do: one
      # returned 200 while every agent session was dying on a config key the agent had
      # dropped. Driving run_agent.sh exercises the config profile, the toolset pin, the
      # throwaway HERMES_HOME, transport, auth and the model id together - and leaves the
      # same usage and controls reports a real cell produces.
      - name: Verify the agent can complete one session
        if: inputs.preflight_only != true
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/agent-preflight"
          git -C "$RUNNER_TEMP/agent-preflight" init --quiet
          printf 'Create a file named agent-was-here.txt containing the single word ok in your current working directory, then reply with the single word: ok\n' > "$RUNNER_TEMP/preflight-prompt.md"
          echo '{}' > "$RUNNER_TEMP/preflight-context.json"
          if ! REPO_AUTOMATION_HERMES_USAGE_DIR="$RUNNER_TEMP/preflight-session" \
            automation/supervisor/run_agent.sh \
              --repo-root "$RUNNER_TEMP/agent-preflight" \
              --prompt-file "$RUNNER_TEMP/preflight-prompt.md" \
              --context-file "$RUNNER_TEMP/preflight-context.json" \
              --handoff-file "$RUNNER_TEMP/preflight-handoff.json" \
              --slice-id preflight 2>&1 | tee /tmp/preflight.log; then
            echo "::error::The agent could not complete a trivial session with ${HERMES_INFERENCE_MODEL}." >&2
            # Exact membership, not a sample. This printed the first 40 ids alphabetically,
            # which stopped at nvidia/* - so for a z-ai model it could never show the one id
            # the failure is about, and run 36736351822's 403 went undiagnosed.
            #
            # Diagnostic only, and deliberately weaker than the check above it: appearing in
            # /models is not a promise of service. The model turn that just failed remains
            # the authority on whether this credential can be served this model.
            curl -sS "$NVIDIA_BASE_URL/models" -H "Authorization: Bearer $NVIDIA_API_KEY" \
              > "$RUNNER_TEMP/model-catalog.json" || true
            python - "$RUNNER_TEMP/model-catalog.json" >&2 <<'PY' || true
          import json, os, pathlib, sys

          requested = os.environ["HERMES_INFERENCE_MODEL"]
          vendor = requested.split("/")[0]
          print(f"requested model: {requested}")
          try:
              payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
              # A JSON error body - {"status": 403, "title": "Forbidden", ...} - parses
              # fine and has no `data`. Reading that as an empty catalog would report the
              # requested model as absent on the strength of the error that stopped us
              # from looking, so require the list before believing anything about it.
              data = payload.get("data")
              if not isinstance(data, list):
                  raise ValueError("response carries no model catalog data list")
              ids = sorted(
                  {
                      str(entry["id"])
                      for entry in data
                      if isinstance(entry, dict) and entry.get("id")
                  }
              )
          except Exception as error:
              # "unknown", never "no": a catalog we could not read is not a catalog that
              # excludes the model, and the difference is the whole point of asking.
              print(f"listed for this credential: unknown, no catalog could be read ({error})")
              raise SystemExit(0)
          print(f"listed for this credential: {'yes' if requested in ids else 'no'}")
          print(f"catalog size for this credential: {len(ids)}")
          siblings = [entry for entry in ids if entry.split("/")[0] == vendor]
          print(f"matching {vendor} models:")
          for entry in siblings:
              print(f"  {entry}")
          if not siblings:
              print(f"  (none, this credential sees no {vendor} model at all)")
          PY
            exit 1
          fi
          grep -qiE '\bok\b' /tmp/preflight.log || {
            echo "::error::The agent ran but produced no usable reply; see the log above." >&2
            exit 1
          }
          # Where the work lands, not just whether a turn came back. The agent's tools
          # resolve their own working directory, and when it was not the checkout the
          # harness handed over, every cell archived an empty workspace, scored
          # compile_failed, and the next cell started on top of the last one's files -
          # after 2h16m of agent budget. Ninety seconds here says so instead.
          test -f "$RUNNER_TEMP/agent-preflight/agent-was-here.txt" || {
            echo "::error::The agent did not write inside the repo root it was given; its work would not reach the submission." >&2
            find "$RUNNER_TEMP/agent-preflight" "$HOME" -maxdepth 1 -name 'agent-was-here.txt' >&2 || true
            exit 1
          }
          python - "$RUNNER_TEMP/preflight-session" <<'PY'
          import glob, json, os, sys

          session = sys.argv[1]
          usage = json.load(open(glob.glob(f"{session}/*.usage.json")[0]))
          controls = json.load(open(glob.glob(f"{session}/*.controls.json")[0]))
          print("preflight usage:", json.dumps(usage))
          print("preflight controls:", json.dumps(controls))

          # Hermes can serve a turn from a different model than the one asked for. Comparing
          # lanes across two models measures nothing, so refuse the run rather than record it.
          served = {"model": usage.get("model"), "provider": usage.get("provider")}
          asked = {
              "model": os.environ["HERMES_INFERENCE_MODEL"],
              "provider": os.environ["HERMES_INFERENCE_PROVIDER"],
          }
          if served != asked:
              print(f"::error::Asked for {asked} but the turn was served by {served}.")
              sys.exit(1)

          # The config profile turns off background review and the title-generation model
          # upgrade. If it had not loaded, a second model would be answering alongside the
          # lane - so a non-zero auxiliary count means the posture is not the one on record.
          auxiliary = usage.get("auxiliary", {}).get("api_calls")
          if auxiliary != 0:
              print(f"::error::Config profile not in effect: {auxiliary} auxiliary calls in a one-turn session.")
              sys.exit(1)
          if controls.get("ignore_user_config") is not False:
              print("::error::The session discarded the benchmark config profile.")
              sys.exit(1)
          PY

      # The inference environment itself, proved before any agent budget is spent: the
      # official cleanroom image materializes, it ships a reference ./executable and the
      # bundled documentation, the workspace is writable, and four different ways out of
      # the container all fail. Every cell repeats this for its own instance and refuses
      # the cell if it does not hold; this run-level check catches a missing Docker, a
      # withdrawn image tag or a runner whose containers still have egress in 90 seconds
      # rather than after a lane's worth of unusable results.
      # The probe used to skip this, back when it ran in a synthetic git repo where the
      # check described nothing it would touch. It runs in the cleanroom now, so the same
      # 90-second refusal protects its 600 seconds too.
      - name: Verify the ProgramBench cleanroom holds
        run: |
          set -o pipefail
          mkdir -p out/preflight
          instance=$(echo "${{ inputs.instances }}" | awk '{print $1}')
          if [ -z "$instance" ]; then
            instance=$(uv run python -c "from automation.benchmark.instances import DEFAULT_SMOKE_INSTANCES as s; print(s[0])")
          fi
          uv run python -m automation.benchmark.cleanroom \
            --instance "$instance" \
            --workspace "$RUNNER_TEMP/cleanroom-preflight" \
            --receipt out/preflight/cleanroom.json | tee /tmp/cleanroom.txt
          printf '```\n%s\n```\n' "$(cat /tmp/cleanroom.txt)" >> "$GITHUB_STEP_SUMMARY"

      # --agent-env, by name, is the only way the key reaches a session: an agent run inherits
      # what run_agent.sh reads and nothing else, so this job's environment is not ambiently
      # readable by the model-authored commands a cell executes. Names only - NAME=value here
      # would print the secret into the job log on top of the runner's process listing.
      - name: Run benchmark (rebuild -> eval -> score)
        if: inputs.experiment != true && inputs.probe != true && inputs.preflight_only != true
        run: |
          if [ "${{ inputs.run_all }}" = "false" ] && [ -n "${{ inputs.instances }}" ]; then
            uv run python -m automation.benchmark all --run-dir out --instances ${{ inputs.instances }} \
              --cleanroom --agent-env NVIDIA_API_KEY --agent-env NVIDIA_BASE_URL
          else
            uv run python -m automation.benchmark all --run-dir out --all \
              --cleanroom --agent-env NVIDIA_API_KEY --agent-env NVIDIA_BASE_URL
          fi

      # Lane E administers the canonical J-Space skill from a pinned external checkout.
      # Without it every E cell is skipped, which would quietly turn an A-E experiment
      # into an A-D one, so provision it from the lock file and prove it resolves before
      # any agent budget is spent. The lock is the single source of the pin.
      # Before spending a diagnostic on the research prompt, prove the two mechanisms it
      # reports through actually work, on a prompt that costs a minute. Both have failed
      # silently once already: a turn cap that the transport ignores produces a receipt
      # saying max_turns=1 over a session that ran to the wall clock, and an accounting
      # source that moved produces zero tokens, which reads exactly like a stalled provider.
      #
      # The prompt needs three sequential tool calls to finish. Uncapped that is four or more
      # API calls and both files; capped at one iteration it is the capped turn plus the one
      # toolless summary call Hermes makes on the way out (agent/turn_finalizer.py:157), and
      # the third step never happens. So `api_calls <= 2` and a missing second file are the
      # cap being consumed, not the model being brief.
      - name: Prove the turn cap is consumed and the accounting is real
        if: inputs.probe == true && inputs.preflight_only != true
        run: |
          set -o pipefail
          rc=0
          proof="$RUNNER_TEMP/cap-proof"
          mkdir -p "$proof/repo"
          git -C "$proof/repo" init --quiet
          printf 'Do these in order, one tool call at a time: (1) write a file first.txt containing the word alpha, (2) read first.txt back, (3) write a file second.txt containing what you read. Then reply with the single word: done\n' > "$proof/prompt.md"
          echo '{}' > "$proof/context.json"
          REPO_AUTOMATION_HERMES_USAGE_DIR="$proof/session" \
          REPO_AUTOMATION_HERMES_TRANSPORT=stream-json \
          REPO_AUTOMATION_HERMES_MAX_TURNS=1 \
            automation/supervisor/run_agent.sh \
              --repo-root "$proof/repo" \
              --prompt-file "$proof/prompt.md" \
              --context-file "$proof/context.json" \
              --handoff-file "$proof/handoff.json" \
              --slice-id cap-proof 2>&1 | tail -40 || rc=$?
          # A capped session need not exit 0 - the cap is a stop, not a success - so the
          # receipts decide. Exit 64 is different in kind: the wrapper refused the cap, and
          # nothing ran, so say that instead of reporting a missing session id.
          if [ "${rc:-0}" = 64 ]; then
            echo "::error::The wrapper refused the turn cap; see its message above." >&2
            exit 1
          fi
          uv run python - "$proof" <<'PY'
          import json, sys
          from pathlib import Path

          from automation.benchmark.probe import session_accounting

          proof = Path(sys.argv[1])
          session_id, usage = session_accounting(proof / "session")
          print("cap proof session:", session_id)
          print("cap proof accounting:", json.dumps(usage))

          if not session_id:
              sys.exit("::error::The capped session emitted no session id, so its accounting cannot be keyed.")
          if not usage or usage.get("error"):
              sys.exit("::error::No accounting row for the capped session - the diagnostic would report no tokens.")
          if not (usage.get("input_tokens") and usage.get("output_tokens")):
              sys.exit(f"::error::The accounting row is empty: {usage}. reasoning_tokens would be unreadable.")
          calls = usage.get("api_calls") or 0
          if not 1 <= calls <= 2:
              sys.exit(f"::error::{calls} api calls under --max-turns 1: the cap was not consumed.")
          if (proof / "repo/second.txt").exists():
              sys.exit("::error::The capped session completed all three steps, so the cap did not stop it.")
          print(f"cap proof ok: {calls} api calls, reasoning_tokens={usage.get('reasoning_tokens')}")
          PY

      # A diagnostic, never a cell: one research phase at the lane's own 600s ceiling, run
      # through `hermes chat --format stream-json` so the events a killed session already
      # flushed survive it. Three A-E runs died here with a 0-byte log and no research.json,
      # and --oneshot can never say why. Nothing this step produces belongs in a comparison:
      # the transport is a different execution path in the agent and leaves no usage receipt.
      - name: Run the stream-json research probe (diagnostic)
        if: inputs.probe == true && inputs.preflight_only != true
        run: |
          set -o pipefail
          instance=$(echo "${{ inputs.instances }}" | awk '{print $1}')
          if [ -z "$instance" ]; then
            echo "::error::The probe needs one instance id in the instances input." >&2
            exit 1
          fi
          # Capped probes stop at the cap, not at the phase ceiling, so the budget is a wall
          # and not the measurement. The flags stay empty unless asked for: an uncapped probe
          # must keep running the phase exactly as a lane's ceiling would.
          cap=""
          if [ -n "${{ inputs.probe_max_turns }}" ]; then
            cap="--max-turns ${{ inputs.probe_max_turns }}"
          fi
          # shellcheck disable=SC2086
          uv run python -m automation.benchmark.probe --instance "$instance" --out-dir out/probe \
            --budget "${{ inputs.probe_budget || 600 }}" $cap \
            --agent-env NVIDIA_API_KEY --agent-env NVIDIA_BASE_URL | tee /tmp/probe.txt
          printf '```\n%s\n```\n' "$(cat /tmp/probe.txt)" >> "$GITHUB_STEP_SUMMARY"

      - name: Provision the pinned J-Space checkout
        if: inputs.experiment == true && contains(inputs.lanes, 'E')
        run: |
          lock=automation/benchmark/jspace.lock.json
          url=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['url'])" "$lock")
          revision=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['revision'])" "$lock")
          git clone --quiet "$url" "$RUNNER_TEMP/j-space"
          git -C "$RUNNER_TEMP/j-space" checkout --quiet "$revision"
          echo "JSPACE_ROOT=$RUNNER_TEMP/j-space" >> "$GITHUB_ENV"

      - name: Verify lane E can administer the canonical artifact
        if: inputs.experiment == true && contains(inputs.lanes, 'E')
        run: |
          uv run python -c "from automation.benchmark import jspace; print(jspace.resolve().provenance())"

      # The experiment costs lanes x repeats x instances agent runs, so it is manual only
      # and defaults to the smoke set. Never put it behind an unattended trigger.
      - name: Run lane experiment (A-E)
        if: inputs.experiment == true && inputs.probe != true && inputs.preflight_only != true
        run: |
          if [ -n "${{ inputs.instances }}" ]; then
            SELECTION="--instances ${{ inputs.instances }}"
          else
            SELECTION=""
          fi
          # The budget is per instance, so worst-case wall clock is instances x lanes x
          # repeats x timeout; keep it under this job's 360-minute cap.
          uv run python -m automation.benchmark lanes --run-dir out --eval \
            --lanes ${{ inputs.lanes }} --repeats ${{ inputs.repeats }} \
            --timeout ${{ inputs.timeout }} $SELECTION --cleanroom \
            --agent-env NVIDIA_API_KEY --agent-env NVIDIA_BASE_URL

      - name: Upload effectiveness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectiveness-report
          path: |
            out/effectiveness-report.json
            out/lane-comparison.json
            out/lane-comparison.md
            out/**/effectiveness-report.json
            out/**/run.json
            out/**/*.eval.json
            out/**/submission.files.txt
            out/**/rpi/*.json
            out/**/agent-sessions/*.json
            out/**/agent-sessions/*.log
            out/**/cleanroom.json
            out/probe/probe.json
            out/probe/agent-sessions/*.stream.jsonl
            out/probe/agent-sessions/*.controls.json
          if-no-files-found: warn
