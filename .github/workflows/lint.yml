name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: make reusable-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dev dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # One step on purpose: `make reusable-check` is the gate a consumer's sync
      # preflight runs, so CI and the import contract cannot drift apart.
      - name: Canonical quality gate
        run: make reusable-check
        env:
          UV_PYTHON: ${{ matrix.python-version }}
