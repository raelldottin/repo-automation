name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  coverage:
    name: Tests + coverage comment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      - name: Run tests with coverage
        run: |
          uv run --frozen pytest automation/tests/test_harness.py \
            --deselect automation/tests/test_harness.py::AutomationHarnessTests::test_live_queue_configures_repo_owned_agent_command \
            --deselect automation/tests/test_harness.py::AutomationHarnessTests::test_build_context_includes_compact_previous_handoff_and_relevant_docs \
            --cov=automation \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=pytest.xml

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1.8.0
        with:
          pytest-xml-coverage-path: coverage.xml
          junitxml-path: pytest.xml
          title: Coverage report
          report-only-changed-files: true
