name: Dependency Check

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dev dependencies
        run: uv sync --frozen --python 3.12

      # uv.lock is the source of truth. Export every locked package (runtime plus
      # the dev group) fully pinned, then audit exactly that set. --no-deps and
      # --disable-pip are safe because the export already lists the transitives.
      - name: Export locked requirements
        run: uv export --frozen --format requirements-txt --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"

      - name: Audit Python dependencies
        run: uv run --frozen pip-audit --requirement "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --vulnerability-service osv --progress-spinner off
