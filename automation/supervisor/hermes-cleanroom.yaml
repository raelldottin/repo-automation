# Hermes terminal posture for ProgramBench cleanroom inference.
#
# Appended to the benchmark profile by run_agent.sh, and only when the adapter names a
# sandbox image - a local cell keeps the local backend. `docker_image` is appended after
# this file because it is per-instance (programbench/<instance>:task_cleanroom_v6).
#
# Every key here is checked against the pinned revision's DEFAULT_CONFIG by the same
# workflow step that checks hermes-benchmark.yaml. Hermes ignores keys it does not know,
# and a silently ignored `docker_network` is an agent with internet access.
terminal:
  # One container per session, entered by `docker exec`. At the pinned revision the
  # terminal, file and code_execution tools all route through it, so the three tool
  # families the benchmark hands the model share one cleanroom workspace by construction.
  backend: docker
  # false = `--network=none`. This is the ProgramBench inference contract: the agent must
  # rebuild from the reference executable and the bundled documentation, and an agent that
  # can reach the upstream repository is answering a different question. Hermes also
  # refuses to attach to an existing networked container while this is false, so the
  # control cannot decay into a reused bridge container between cells.
  docker_network: false
  # TERMINAL_CWD is the cell's workspace, already holding everything the cleanroom image
  # ships in /workspace. This remaps the session cwd to /workspace and is what makes the
  # CLI parent's "default" backend bind the workspace there. Without it Hermes mounts its
  # own /workspace - a tmpfs here, since the container is not persistent - which would hide
  # the reference ./executable and the bundled documentation behind an empty directory.
  #
  # It is NOT sufficient on its own, which run 36485906813 showed: under the
  # `container_persistent: false` below, every tool call an agent turn makes carries a
  # session task id, and `_resolve_task_host_cwd` deliberately refuses to derive a mount
  # from TERMINAL_CWD for a session-scoped container (the env var is a launch artifact that
  # outlives the session that set it, so reusing it could leak the previous session's
  # directory). The model's own container therefore got the tmpfs. run_agent.sh appends the
  # explicit `docker_volumes` binding below, which applies to every task id.
  docker_mount_cwd_to_workspace: true
  # No sandbox directory reused between sessions: a lane that measures what compaction
  # drops is worthless if the next phase can read the last phase's leftovers.
  container_persistent: false
  # The one that actually stops container reuse on this path. At the pinned revision
  # `_build_docker_env` only forces `persist_across_processes=False` for a session-scoped
  # container, and a CLI session has no session key, so its task id stays "default" and
  # the configured value (default true) reaches DockerEnvironment. Reuse is then looked up
  # by task/profile/egress labels and the network mode - never by image and never by bind
  # mount - and `_attach_existing_container` deliberately *keeps* an existing
  # `--network=none` container under `docker_network: false`. One cell could therefore
  # inherit the previous cell's container, still holding the previous instance's image and
  # the previous instance's workspace mount. false makes each session create and remove
  # its own. Absent from DEFAULT_CONFIG but honoured: `TERMINAL_CONFIG_ENV_MAP` bridges it
  # to TERMINAL_DOCKER_PERSIST_ACROSS_PROCESSES, which terminal_tool reads into the
  # container config. The workflow checks that bridge, not just the defaults.
  docker_persist_across_processes: false
  # Nothing from the host environment enters the container. NVIDIA_API_KEY stays in the
  # Hermes process, which is outside the sandbox; the model-facing tools never see it.
  # Both are already the shipped defaults - stated here because they are controls under
  # test, and a default that changes upstream would otherwise change the experiment.
  docker_forward_env: []
  docker_env: {}
  # 0 = omit the flag, i.e. whatever the host has. Hermes' own defaults are 1 CPU and 5 GB,
  # and a from-scratch rebuild metered at one core is measuring the cgroup, not the lane.
  # ProgramBench's own baseline harness gives its containers 20 CPUs and 60 GB.
  container_cpu: 0
  container_memory: 0
